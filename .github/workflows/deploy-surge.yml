name: Deploy to Surge

# Runs on every push to main. Builds the Vite bundle and publishes it to
# metadis.surge.sh non-interactively using the SURGE_LOGIN / SURGE_TOKEN
# repo secrets. Tests are run as a hard gate first — a red test cancels
# the deploy so the device never picks up a broken HUD.
#
# Manual trigger (workflow_dispatch) lets you redeploy without a commit,
# useful if surge's CDN ever needs a kick.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: surge-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Using `npm install` instead of `npm ci` because the lock file is
      # generated on macOS and is missing Linux-only transitive deps
      # (@emnapi/core etc). `npm install` reconciles those without failing.
      # Determinism loss is acceptable for a 3-dep app.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        # surge's publish step occasionally hangs then reports "Deployment did
        # not succeed" even though auth + upload worked. Retry up to 3x before
        # failing the job.
        run: |
          for i in 1 2 3; do
            npx --yes surge dist/ metadis.surge.sh && exit 0
            echo "surge attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "surge failed after 3 attempts"
          exit 1
